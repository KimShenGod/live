name: Daily Download and Run

on:
  schedule:
    - cron: '0 9 * * *'  # UTC时间09:00，北京时间17:00
  workflow_dispatch:  # 允许手动触发

# 全局默认 shell
defaults:
  run:
    shell: /usr/bin/bash -e {0}

jobs:
  # =========================================================================
  # Job 1: 下载 bbxx.m3u 源文件 + 切成 N 个块（每块带完整文件头），上传为 artifact
  # =========================================================================
  split:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    outputs:
      chunks: ${{ steps.gen-chunks.outputs.chunks }}   # JSON 数组，供 matrix 使用
    steps:
    - name: Checkout repository
      uses: actions/checkout@v5
      with:
        fetch-depth: 0

    - name: Checkout collect-txt and copy target file
      uses: actions/checkout@v5
      with:
        repository: kimwang1978/collect-txt
        path: collect-txt
        token: ${{ secrets.GITHUB_TOKEN }}
        fetch-depth: 1

    - name: Copy target file into workspace and verify
      run: |
        TARGET_FILE="bbxx.m3u"
        SRC_PATH="${{ github.workspace }}/collect-txt/$TARGET_FILE"
        if [ ! -f "$SRC_PATH" ]; then
          echo "Error: Source file not found at $SRC_PATH"
          ls -la "${{ github.workspace }}/collect-txt" || true
          exit 1
        fi
        cp "$SRC_PATH" "$TARGET_FILE"
        echo "✅ Copied $SRC_PATH -> $TARGET_FILE (size: $(stat -c%s "$TARGET_FILE") bytes)"
        head -n 20 "$TARGET_FILE" || true

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    - name: Debug - show workspace and src contents
      run: |
        echo "GITHUB_WORKSPACE: $GITHUB_WORKSPACE"
        pwd
        ls -la .
        echo "Listing src/"
        ls -la src || true
        which tree >/dev/null 2>&1 && tree -a -L 2 || true

    # 切分：bbxx → bbxx_chunk_XX.m3u（每块带完整头部）
    - name: Split into chunks (each with full header)
      id: gen-chunks
      env:
        CHUNK: "2000"   # 每块频道数；bbxx 约 2 万源 → ~11 块；单块约 13 分钟
      run: |
        python - <<'PY'
        import json, os
        CHUNK = int(os.environ["CHUNK"])

        def split_file(src, prefix):
            """把 src 切成若干带完整头部的块，返回块名列表（空文件返回 []）。"""
            if not os.path.exists(src) or os.path.getsize(src) == 0:
                print(f"⚠️ {src} 不存在或为空，跳过分块")
                return []
            lines = open(src, encoding="utf-8", errors="replace").readlines()
            first_inf = next((i for i, l in enumerate(lines) if l.strip().startswith("#EXTINF:")), len(lines))
            header = lines[:first_inf]
            # 按 #EXTINF 切成频道块
            blocks, cur = [], []
            for l in lines[first_inf:]:
                if l.strip().startswith("#EXTINF:") and cur:
                    blocks.append(cur); cur = []
                cur.append(l)
            if cur:
                blocks.append(cur)
            # 按 CHUNK 合并成最终分块
            chunks, buf, n = [], [], 0
            for b in blocks:
                buf.extend(b); n += 1
                if n >= CHUNK:
                    chunks.append(buf); buf, n = [], 0
            if buf:
                chunks.append(buf)
            names = []
            for i, ch in enumerate(chunks):
                name = f"{prefix}_chunk_{i:02d}.m3u"
                with open(os.path.join("chunks", name), "w", encoding="utf-8") as f:
                    f.writelines(header)
                    f.writelines(ch)
                names.append(name)
            print(f"{src}: {len(blocks)} 频道 → {len(chunks)} 块")
            return names

        os.makedirs("chunks", exist_ok=True)
        names = split_file("bbxx.m3u", "bbxx")
        with open("chunks/manifest.json", "w") as f:
            json.dump(names, f)
        # 输出给 matrix（单行 JSON）
        with open(os.environ["GITHUB_OUTPUT"], "a") as f:
            f.write("chunks=" + json.dumps(names) + "\n")
        PY

    - name: Upload chunks artifact
      uses: actions/upload-artifact@v5
      with:
        name: chunks
        path: |
          chunks/
          bbxx.m3u
        if-no-files-found: error

  # =========================================================================
  # Job 2: 矩阵并行处理每个块（各自独立 runner，互不干扰）
  #        块名前缀为 bbxx_，输出名 bbxx_iptv_chunk_XX.m3u
  # =========================================================================
  process:
    needs: split
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false          # 单块失败不连累其他块
      max-parallel: 20          # 同时并行的块数上限
      matrix:
        chunk: ${{ fromJson(needs.split.outputs.chunks) }}
    steps:
    - name: Checkout repository
      uses: actions/checkout@v5
      with:
        fetch-depth: 0

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.10'

    - name: Install FFmpeg (for FFprobe)
      run: sudo apt-get update && sudo apt-get install -y ffmpeg

    - name: Install dependencies
      run: |
        pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    - name: Download chunk artifact
      uses: actions/download-artifact@v5
      with:
        name: chunks
        path: .

    - name: Process chunk ${{ matrix.chunk }}
      run: |
        SCRIPT_PATH="${{ github.workspace }}/src/merged_m3u_processor.py"
        if [ ! -f "$SCRIPT_PATH" ]; then
          echo "Error: Script not found at $SCRIPT_PATH!"
          echo "Files in src/:"
          ls -la "${{ github.workspace }}/src" || true
          exit 1
        fi
        CHUNK_NAME="${{ matrix.chunk }}"          # 如 bbxx_chunk_00.m3u
        CHUNK_ID="${CHUNK_NAME%.m3u}"             # 去掉 .m3u → bbxx_chunk_00
        CHUNK_NUM="${CHUNK_ID#bbxx_}"             # 去掉 bbxx_ 前缀 → chunk_00
        # 输出名：bbxx → bbxx_iptv_chunk_XX.m3u（必须带 .m3u，与 finalize 的 glob 对齐）
        OUT="bbxx_iptv_${CHUNK_NUM}.m3u"
        # 输入名：artifact 下载到 . 后，chunk 文件位于 chunks/ 下
        IN="chunks/${CHUNK_NAME}"
        if [ ! -f "$IN" ]; then
          echo "Error: Input chunk not found at $IN"
          echo "Listing chunks/:"; ls -la chunks/ || true
          exit 1
        fi
        CONCURRENCY=8
        echo "OUT=$OUT" >> "$GITHUB_ENV"
        # --fast 快速模式；--ffprobe-timeout 8 死源 8 秒内放弃。
        # 降低并发（t=8/c=4）减少 FFprobe 超时与整体运行时长，避免触碰 runner 上限。
        python "$SCRIPT_PATH" "$IN" -o "$OUT" --fast -t "$CONCURRENCY" -c 4 --fast-sample 2 --ffprobe-timeout 8 --source-timeout 60

    - name: Show generated files (debug)
      run: |
        echo "OUT=$OUT"
        echo "Listing workspace root:"; pwd; ls -la .
        echo "Generated outputs:"; ls -la "${OUT}"* 2>/dev/null || true
        find . -maxdepth 4 -type f -name "${OUT}*" -print 2>/dev/null || true

    - name: Upload part result
      uses: actions/upload-artifact@v5
      with:
        name: part-${{ matrix.chunk }}
        path: |
          ${{ env.OUT }}
          ${{ env.OUT }}.stability.csv
        if-no-files-found: error

  # =========================================================================
  # Job 3a: 合并 bbxx 分块 → 执行 EPG/merge/改名 → 提交
  # =========================================================================
  finalize-bbxx:
    needs: [split, process]
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write
    steps:
    - name: Checkout repository
      uses: actions/checkout@v5
      with:
        fetch-depth: 0

    - name: Debug - show workspace and src contents
      run: |
        echo "GITHUB_WORKSPACE: $GITHUB_WORKSPACE"
        pwd
        ls -la .
        echo "Listing src/"
        ls -la src || true

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    - name: Download bbxx.m3u (for commit) and all part results
      uses: actions/download-artifact@v5
      with:
        pattern: part-*        # 下载所有 part-* artifact 到各自目录
        path: parts
        merge-multiple: false

    - name: Show downloaded parts (debug)
      run: |
        echo "Listing parts/:"; ls -la parts/ || true
        echo "All files under parts/ (max depth 4):"
        find parts -maxdepth 4 -type f -print 2>/dev/null || true

    - name: Merge bbxx chunks into bbxx_iptv.m3u
      run: |
        python - <<'PY'
        import os, glob, csv
        part_dir = "parts"
        part_files = sorted(glob.glob(os.path.join(part_dir, "**", "bbxx_iptv_chunk_*.m3u"), recursive=True))
        if not part_files:
            raise SystemExit("未找到任何 bbxx 分块产物，合并失败")
        print(f"合并 {len(part_files)} 个分块 → bbxx_iptv.m3u")
        header_written = False
        with open("bbxx_iptv.m3u", "w", encoding="utf-8") as out:
            for pf in part_files:
                lines = open(pf, encoding="utf-8", errors="replace").readlines()
                if not header_written:
                    out.writelines(lines); header_written = True
                else:
                    start = next((i for i, l in enumerate(lines) if l.strip().startswith("#EXTINF:")), 0)
                    out.writelines(lines[start:])
        # 合并 stability.csv
        csv_parts = sorted(glob.glob(os.path.join(part_dir, "**", "bbxx_iptv_chunk_*.stability.csv"), recursive=True))
        if csv_parts:
            with open("bbxx_iptv.m3u.stability.csv", "w", encoding="utf-8-sig", newline="") as out:
                wrote_head = False
                for cf in csv_parts:
                    with open(cf, encoding="utf-8-sig", newline="") as f:
                        rows = list(csv.reader(f))
                    if not rows:
                        continue
                    if not wrote_head:
                        out.write(",".join(rows[0]) + "\n"); wrote_head = True
                    for r in rows[1:]:
                        out.write(",".join(r) + "\n")
            print("✅ 合并 bbxx stability.csv 完成")
        PY

    - name: Run EPG merge script
      run: |
        SCRIPT_PATH="${{ github.workspace }}/src/merge_epg_xml.py"
        if [ ! -f "$SCRIPT_PATH" ]; then
          echo "Error: Script not found at $SCRIPT_PATH!"; ls -la "${{ github.workspace }}/src" || true; exit 1
        fi
        python "$SCRIPT_PATH"

    - name: Run channel merge script
      run: |
        SCRIPT_PATH="${{ github.workspace }}/src/merge_channels.py"
        if [ ! -f "$SCRIPT_PATH" ]; then
          echo "Error: Script not found at $SCRIPT_PATH!"; ls -la "${{ github.workspace }}/src" || true; exit 1
        fi
        python "$SCRIPT_PATH" bbxx_iptv.m3u

    - name: Run modify channel name script (bbxx)
      run: |
        SCRIPT_PATH="${{ github.workspace }}/src/update_channel_names.py"
        if [ ! -f "$SCRIPT_PATH" ]; then
          echo "Error: Script not found at $SCRIPT_PATH!"; ls -la "${{ github.workspace }}/src" || true; exit 1
        fi
        python "$SCRIPT_PATH" -a alias2.txt -i bbxx_lite.m3u -o bbxx_lite_new.m3u

    - name: Commit and push bbxx results
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git stash push -m "workflow-temp-stash-bbxx" || true
        git pull --rebase origin main || { echo "Rebase failed, trying merge..."; git pull origin main || { echo "Merge also failed, aborting..."; exit 1; }; }
        git stash pop || true
        git add bbxx.m3u bbxx_iptv.m3u bbxx_iptv.m3u.stability.csv bbxx_lite.m3u merged_epg.xml
        if git diff --staged --quiet; then
          echo "No bbxx changes to commit."
        else
          git commit -m "Auto update bbxx IPTV [$(date +'%Y-%m-%d %H:%M:%S')]"
          git push origin HEAD:main || git push --force-with-lease origin HEAD:main
        fi

